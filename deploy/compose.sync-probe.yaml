# Local proof only. Database is supplied by compose.dev.yaml's private network.
services:
  powersync:
    image: journeyapps/powersync-service:1.27.0
    command: [start, -r, unified]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=400
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:?Generated by run_sync_probe.py}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI:?Generated by run_sync_probe.py}
    ports:
      - "127.0.0.1:18290:8080"
    volumes:
      - ${APP_DATA_PROBE_CONFIG_DIRECTORY:?Generated by run_sync_probe.py}:/config:ro
    networks: [development]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/probes/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 15
networks:
  development:
    external: true
    name: app-data-service-dev_default
