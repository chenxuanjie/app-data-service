config:
  edition: 3
  storage_version: 2
streams:
  private_expenses:
    auto_subscribe: true
    query: "SELECT expenses.* FROM zheri.expenses\nWHERE deleted_at IS NULL AND dataset_id\
      \ IN (\n  SELECT id FROM core.datasets WHERE app_id = auth.parameter('app_id')\
      \ AND app_id = 'zheri' AND id IN (\n    SELECT dataset_id FROM core.dataset_members\
      \ WHERE user_id = auth.user_id()\n  )\n)\n"
  private_assets:
    auto_subscribe: true
    query: "SELECT assets.* FROM zheri.assets\nWHERE deleted_at IS NULL AND dataset_id\
      \ IN (\n  SELECT id FROM core.datasets WHERE app_id = auth.parameter('app_id')\
      \ AND app_id = 'zheri' AND id IN (\n    SELECT dataset_id FROM core.dataset_members\
      \ WHERE user_id = auth.user_id()\n  )\n)\n"
