      \ auth.parameter('app_id') AND app_id = 'zheri' AND id IN (\n    SELECT dataset_id\
      \ FROM core.dataset_members WHERE user_id = auth.user_id()\n  )\n)\n"
  private_business_preferences:
    auto_subscribe: true
    query: "SELECT business_preferences.* FROM zheri.business_preferences\nWHERE deleted_at\
      \ IS NULL AND dataset_id IN (\n  SELECT id FROM core.datasets WHERE app_id =\
      \ auth.parameter('app_id') AND app_id = 'zheri' AND id IN (\n    SELECT dataset_id\
      \ FROM core.dataset_members WHERE user_id = auth.user_id()\n  )\n)\n"
