  board_private_favorites:
    auto_subscribe: true
    query: SELECT favorites.* FROM board_game_agent.favorites WHERE auth.parameter('sync_scope')
      IS NULL AND deleted_at IS NULL AND dataset_id IN (SELECT id FROM core.datasets
      WHERE app_id=auth.parameter('app_id') AND app_id='board_game_agent' AND id IN
      (SELECT dataset_id FROM core.dataset_members WHERE user_id=auth.user_id()))
  board_private_recent_games:
    auto_subscribe: true
    query: SELECT recent_games.* FROM board_game_agent.recent_games WHERE auth.parameter('sync_scope')
      IS NULL AND deleted_at IS NULL AND dataset_id IN (SELECT id FROM core.datasets
      WHERE app_id=auth.parameter('app_id') AND app_id='board_game_agent' AND id IN
      (SELECT dataset_id FROM core.dataset_members WHERE user_id=auth.user_id()))
