config:
  edition: 3
  storage_version: 2
streams:
  private_expenses:
    auto_subscribe: true
    query: |
      SELECT expenses.* FROM zheri.expenses
      WHERE deleted_at IS NULL AND dataset_id IN (
        SELECT id FROM core.datasets WHERE app_id = 'zheri' AND id IN (
          SELECT dataset_id FROM core.dataset_members WHERE user_id = auth.user_id()
        )
      )
  private_assets:
    auto_subscribe: true
    query: |
      SELECT assets.* FROM zheri.assets
      WHERE deleted_at IS NULL AND dataset_id IN (
        SELECT id FROM core.datasets WHERE app_id = 'zheri' AND id IN (
          SELECT dataset_id FROM core.dataset_members WHERE user_id = auth.user_id()
        )
      )
  private_expense_categories:
    auto_subscribe: true
    query: |
      SELECT expense_categories.* FROM zheri.expense_categories
      WHERE deleted_at IS NULL AND dataset_id IN (
        SELECT id FROM core.datasets WHERE app_id = 'zheri' AND id IN (
          SELECT dataset_id FROM core.dataset_members WHERE user_id = auth.user_id()
        )
      )
