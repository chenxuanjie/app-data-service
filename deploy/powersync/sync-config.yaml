      (SELECT dataset_id FROM core.dataset_members WHERE user_id=auth.user_id()))
  board_private_votes:
    auto_subscribe: true
    query: SELECT votes.* FROM board_game_agent.votes WHERE auth.parameter('sync_scope')
      IS NULL AND deleted_at IS NULL AND dataset_id IN (SELECT id FROM core.datasets
      WHERE app_id=auth.parameter('app_id') AND app_id='board_game_agent' AND id IN
      (SELECT dataset_id FROM core.dataset_members WHERE user_id=auth.user_id()))
  board_public_changes:
    auto_subscribe: true
    query: SELECT * FROM board_game_agent.public_changes WHERE auth.parameter('app_id')='board_game_agent'
      AND auth.parameter('sync_scope')='public'
