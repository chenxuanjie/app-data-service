name: Build and publish API image

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout committed sources
        uses: actions/checkout@v6

      - name: Determine image names and tags
        id: image
        run: python3 tools/ghcr_metadata.py

      - name: Prepare locked Linux Python wheels
        run: |
          mkdir -p .docker-wheels
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" --workdir /workspace \
            python:3.14.2-slim-bookworm \
            python -m pip download --disable-pip-version-check \
              --only-binary=:all: --no-deps \
              --timeout 120 --retries 5 \
              --dest .docker-wheels -r requirements-runtime.lock

      - name: Confirm source tree is unchanged
        run: test -z "$(git status --porcelain)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=api-linux-amd64
          cache-to: type=gha,mode=max,scope=api-linux-amd64

      - name: Report published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published image: %s@%s\n' "$IMAGE" "$DIGEST"
          printf 'Source commit: %s\n' "$GITHUB_SHA"
