[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "app-data-service"
version = "0.6.0"
description = "PostgreSQL foundation for offline-first Flutter apps"
requires-python = ">=3.12,<3.15"
dependencies = [
  "SQLAlchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "fastapi==0.148.0",
  "uvicorn==0.54.0",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
  "ag-ui-langgraph[fastapi]==0.0.47",
  "ag-ui-protocol==1.0.0",
  "langchain==1.5.0",
  "langgraph==1.2.21",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg-pool==3.3.3",
  "langchain-openai==1.7.4",
  "langsmith==0.14.17",
  "openai==3.50.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "PyYAML==6.0.3", "httpx==0.28.1"]

[project.scripts]
app-data = "app_data_service.cli:main"
board-agent = "app_data_service.modules.board_game_agent.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -x --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
